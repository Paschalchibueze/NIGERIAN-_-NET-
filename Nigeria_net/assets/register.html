<!DOCTYPE html>

<html lang="en" >
<head>
    <meta charset="utf-8" />
    <title> MY REGISTRATION FORM</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            width: 700px;
            height: 350px;
            border: 1px solid white;
            background: linear-gradient(purple 60%, red);
            display: flex;
            color: white;
            padding: 1em;
            text-align: center;
            box-shadow: 7px 7px 7px white;
            border-radius: 10px;
        }
        .writting{
            width: 50%;
            font-display: Georgia, 'Times New Roman', Times, serif;
        }
        .signup{
            width: 50%;
        }
        input, button{
            width: 80%;
            height: 30px;
            border: none;
            border-bottom: 1px solid white;
            margin-top: 1em;
            background: purple;
        }
        input::placeholder{
            color: white;
        }
        input[type="submit"]{
            background: whitesmoke;
            cursor: pointer;
            margin-top: 3em;
            letter-spacing: 2px;
            border-radius: 10px;
            box-shadow: inset 10px 10px 10px purple;
        }
        input[type="radio"]{
            cursor:cell;
            width: 30%;
            height: 30%;
            
            background: gray;
        }
        header{
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 80px;
            background: #800000;
            box-shadow: 6px 6px 6px white;
        }
        header a{
            color: wheat;
            text-decoration: none;
            font-size: 17px;
        }
        nav {
            margin-left: 5em;
            line-height: 3;
        }
        nav a{
            margin-left: 2em;
        }
        small{
            position: relative;
            top: 100px;
        }
       aside {
            position: relative;
            top: 200px;
            font-family:Berlin Sans FB;   
        }
    </style>
</head>
<body>
    <header class=" Ucontainer"> <!--FIRST SECTION -->
        <a>  
            <section class="Ucontainer">
                <h1>   
                    <a href="index.html">Nigeria Net</a>
                </h1> 
            </section>
        </a> 
        <nav>  
            <a href=" index.html" class="btn btn-alt">Home</a>
            <a href=" speakers.html" class="btn btn-alt">Speakers</a>
            <a href=" schedule.html" class="btn btn-alt">Schedule</a>
            <a href=" venue.html" class="btn btn-alt">Venue</a> 
           
        </nav>
    </header>
    <div class="container">
        <div class="writting">
            <b><h1> NIGERIA NET.</h1></b> 
            <p> Become a member and access all the features
            </p>
           
         <small>
                FUN AND EXCITNG ADEVENTURES AS WE ROLL AND DISCOVER VARIOUS 
                ARTICLES AND DISCOVERIES </small>
                <aside> What is stopping you from registering?</aside>
      
            
        </div>
        <div class="signup">
           <b><h1>READY TO DIVE IN</h1></b></br>
           <i><p> Register to become a member! </p></i>
           <form action="submit.html" method="post">
            <input type="text" placeholder="Enter your Name" name="user_email" required> 
            <input type="email" placeholder="Enter your Email" name="user_email" required>
            <input type="password" placeholder="Create password" id="password" name="user_password" required>
            <input type="radio" id="male" name="gender" value="male"name="user_gender" required>Male
    
            <input type="radio" id="female" name="gender" value="female" name="user_gender" required>Female
            

            <input type="submit" value="Register" onchange="" >
        
         </form>
        </div>
    </div>

</body>
</html>
